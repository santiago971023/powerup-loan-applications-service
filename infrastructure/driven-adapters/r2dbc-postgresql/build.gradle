
ext {
    springCloudAwsVersion = "3.0.1" // Usa una versión compatible con tu Spring Boot
}

dependencyManagement {
    imports {
        mavenBom "io.awspring.cloud:spring-cloud-aws-dependencies:${springCloudAwsVersion}"
    }
}


dependencies {
    implementation project(':model')
    implementation 'org.springframework:spring-context'
    implementation 'org.springframework.boot:spring-boot-starter-data-r2dbc'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'jakarta.persistence:jakarta.persistence-api' // TODO: Check if it's still necessary
    implementation 'org.postgresql:r2dbc-postgresql'
    implementation 'org.reactivecommons.utils:object-mapper-api:0.1.0'

    testImplementation 'org.reactivecommons.utils:object-mapper:0.1.0'

    implementation "org.mapstruct:mapstruct:1.5.5.Final" // Recomiendo esta versión estable


    annotationProcessor "org.mapstruct:mapstruct-processor:1.5.5.Final"

    annotationProcessor "org.projectlombok:lombok-mapstruct-binding:0.2.0"

    implementation "org.springdoc:springdoc-openapi-starter-webflux-ui:2.5.0"


    implementation 'io.awspring.cloud:spring-cloud-aws-starter-sqs:3.0.0'



}

